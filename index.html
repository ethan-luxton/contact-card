<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2efe9" />
    <meta name="description" content="Digital work contact card. Save contact details or share instantly." />
    <meta property="og:title" content="Work contact card" />
    <meta property="og:description" content="Digital work contact card" />
    <meta property="og:type" content="profile" />
    <title>Work contact card</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="profile-name">
        <div class="card-top">
          <a class="wordmark" id="company-link" href="#">
            <span class="wordmark-mark" id="company-mark" aria-hidden="true"></span>
            <span id="company-name">Company</span>
          </a>

          <button class="icon-button" id="share-top" type="button" aria-label="Share this contact">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0-12L8 7m4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
            </svg>
          </button>
        </div>

        <div class="portrait-wrap">
          <div class="portrait-frame">
            <img id="profile-image" src="assets/ethan-luxton.svg" alt="" width="184" height="184" />
          </div>
          <span class="status-dot" aria-label="Available to connect"></span>
        </div>

        <div class="identity">
          <p class="eyebrow">Hello, I’m</p>
          <h1 id="profile-name">Contact name</h1>
          <p class="role"><span id="job-title">Job title</span> <span aria-hidden="true">•</span> <span id="role-company">Company</span></p>
          <p class="intro" id="contact-bio"></p>
        </div>

        <div class="actions" aria-label="Contact actions">
          <a class="primary-button" id="save-contact" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" />
            </svg>
            Save contact
          </a>
          <button class="secondary-button" id="share-contact" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0-12L8 7m4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
            </svg>
            Share
          </button>
        </div>

        <div class="contact-list">
          <a class="contact-row" id="email-link" href="#">
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 7l9 7 9-7" /></svg>
            </span>
            <span>
              <small>Email</small>
              <strong id="email-address">Email address</strong>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </a>

          <a class="contact-row" id="phone-link" href="#">
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-4-1-1.2 2a15.4 15.4 0 0 1-9.8-9.8L8 7 7 3Z" /></svg>
            </span>
            <span>
              <small>Work phone</small>
              <strong id="phone-number">Phone number</strong>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </a>

          <a class="contact-row" id="linkedin-link" href="#" target="_blank" rel="noreferrer">
            <span class="contact-icon linkedin" aria-hidden="true">in</span>
            <span>
              <small>LinkedIn</small>
              <strong id="linkedin-label">LinkedIn profile</strong>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </a>
        </div>

        <button class="tap-card" id="tap-share" type="button">
          <span class="tap-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <path d="M14 27c-3-4-3-10 0-14m5 19c-6-7-6-17 0-24m6 19c3-4 3-10 0-14m-5 9v-4" />
            </svg>
          </span>
          <span>
            <strong>Tap to share</strong>
            <small>Open AirDrop, then bring iPhones together</small>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>

        <p class="fine-print">Made for meaningful connections.</p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
